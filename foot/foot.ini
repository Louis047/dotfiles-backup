[main]
include=~/.config/foot/themes/noctalia

font=CommitMono Nerd Font Mono:size=10.5
font-bold=CommitMono Nerd Font Mono:weight=bold:size=10.5
font-italic=CommitMono Nerd Font Mono:slant=italic:size=10.5
font-bold-italic=CommitMono Nerd Font Mono:weight=bold:slant=italic:size=10.5
pad=0x0
resize-by-cells=yes
[scrollback]
lines=5000
multiplier=3.0
indicator-position=none

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[csd]
preferred=none
