config_version = 14

[backdrop]
enabled = true

[bar]
order = [ "default" ]

    [bar.default]
    capsule_thickness = 0.99999998137354851
    center = [ "active_window" ]
    end = [ "group:g2", "group:g3", "group:g1", "group:g4", "bar_2" ]
    font_family = "CommitMono Nerd Font Propo"
    hover_highlight = false
    margin_ends = 0
    padding = 6
    radius = 0
    shadow = false
    start = [ "workspaces" ]
    thickness = 30
    widget_icon_spacing = 0
    widget_spacing = 2

        [[bar.default.capsule_group]]
        accordion = true
        accordion_direction = "end"
        border = ""
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "Tools", "bar", "notes", "clipboard", "notifications", "session" ]
        opacity = 0.0
        padding = 0.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "volume", "network", "battery" ]
        opacity = 0.0
        padding = 0.0

        [[bar.default.capsule_group]]
        accordion = true
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g3"
        members = [ "Info", "sysmon", "cpu", "ram", "temp" ]
        opacity = 0.0
        padding = 0.0
        radius = 0.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g4"
        members = [ "tray", "clock" ]
        opacity = 0.0
        padding = 0.0

[control_center]
show_session_button = false
show_shortcut_labels = false

    [control_center.media]
    show_audio_visualizer = false

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 1.0
inactive_opacity = 1.0
radius = 0
shadow = false

[hooks]
battery_charging = "~/.config/hypr/scripts/power-refresh.sh"
battery_discharging = "~/.config/hypr/scripts/power-refresh.sh"
battery_plugged = "~/.config/hypr/scripts/power-refresh.sh"
started = "~/.config/hypr/scripts/power-refresh.sh"

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 1
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000003" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 960.0
    cy = 956.0
    output = "HDMI-A-1"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        center_password_text = false
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 959.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = true
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = false
        show_keyboard_layout = false
        show_login_button = false
        show_media = true
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 160.0
    box_width = 304.0
    cx = 960.0
    cy = 172.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        background = false
        background_color = "surface"
        background_opacity = 0.80000000000000004
        background_padding = 10
        background_radius = 12
        center_text = true
        circle = true
        clock_style = "digital"
        color = "on_surface"
        font_family = ""
        format = "{:%H:%M}"
        shadow = true
        timezone = ""

[plugin_settings."damian-ds7/battery-threshold"]
battery_device = "/sys/class/power_supply/BAT1"
charge_threshold = 75
panel_position = "auto"

[plugin_settings."l0n3/display-manager"]
backend = "hyprland"

[plugin_settings."noctalia/example"]
panel_open_near_click = true
panel_placement = "attached"
panel_position = "auto"

[plugin_settings."noctalia/notes"]
panel_open_near_click = true
panel_placement = "attached"

[plugin_settings."noctalia/screen_recorder"]
color_range = "full"
quality = "ultra"
resolution = "original"
video_codec = "hevc"
video_source = "focused"

[plugin_settings."oldirtty/color_picker"]
swatch-radius = 0

[plugin_settings."yuuto/calculator"]
panel_placement = "floating"

[plugins]
enabled = [ "noctalia/notes", "yuuto/calculator" ]

    [[plugins.source]]
    auto_update = true
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    auto_update = true
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
avatar_path = "/home/l0n3/Pictures/Profile/luffy_face_transparent.png"
font_family = "CommitMono Nerd Font"
hover_borders = false
launch_apps_as_systemd_services = true
polkit_agent = true
profile_borders = false
screen_time_enabled = true
settings_window_translucent = true
show_location = false
telemetry_enabled = true

    [shell.panel]
    clipboard_placement = "attached"
    clipboard_position = "auto"
    list_item_background = true
    open_near_click_clipboard = true
    open_near_click_session = true
    session_placement = "floating"
    transparency_mode = "solid"

    [shell.screenshot]
    annotate = true

    [shell.session]
    grid = true
    grid_columns = 1

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        variant = "default"

        [[shell.session.actions]]
        action = "suspend"
        countdown_seconds = 0.0
        enabled = true
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        variant = "destructive"

    [shell.shadow]
    direction = "center"

[theme]
builtin = "Gruvbox"
community_palette = "Monochrome"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    builtin_ids = [ "btop", "foot", "gtk3", "gtk4", "kcolorscheme", "qt" ]
    community_ids = [ "antigravity", "opencode", "micro", "heroiclauncher", "obs", "zathura", "papirus-icons" ]

[wallpaper]
directory = "/home/l0n3/Pictures/Wallpapers"
transition = [ "disc" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/l0n3/Pictures/Wallpapers/Normal Wallpapers/wallhaven-21d6g9_1920x1080.png"

    [wallpaper.last]
    path = "/home/l0n3/Pictures/Wallpapers/Normal Wallpapers/wallhaven-21d6g9_1920x1080.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/l0n3/Pictures/Wallpapers/Normal Wallpapers/gzml-shell.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/l0n3/Pictures/Wallpapers/Normal Wallpapers/wallhaven-21d6g9_1920x1080.png"

[widget.Info]
glyph = "heart-rate-monitor"
type = "custom_button"

[widget.Tools]
glyph = "menu-2"
type = "custom_button"

[widget.active_window]
anchor = true
capsule_opacity = 0.0
display = "text_only"
icon_size = 16
interactive = false
title_scroll = "always"

[widget.bar]
type = "yuuto/calculator:bar"

[widget.bar_2]
type = "ahmedhossamdev/display-arrange:bar"

[widget.battery]
show_label = false

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.clock]
capsule_fill = "outline"
capsule_padding = 10

[widget.cpu]
visualization = "none"

[widget.launcher]
custom_image_colorize = true
glyph = "assembly-filled"

[widget.media]
album_art_only = true
art_size = 12
hide_artist = true
hide_when_no_media = true

[widget.network]
show_label = false
show_signal_strength = true
wifi_show_strength = true

[widget.notes]
type = "noctalia/notes:notes"

[widget.ram]
stat = "ram_pct"
visualization = "none"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.session]
capsule_fill = "outline"

[widget.sysmon]
show_value = true
stat = "disk_used_pct"
visualization = "none"

[widget.temp]
visualization = "none"

[widget.tray]
detached_panel = true

[widget.volume]
show_label = false

[widget.weather]
show_condition = false
show_temperature = false

[widget.workspaces]
capsule_padding = 0
capsule_radius = 0
pill_scale = 0.75
style = "minimal"